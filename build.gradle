// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// http://www.gradle.org/docs/current/dsl/org.gradle.api.plugins.ExtraPropertiesExtension.html
project.ext {
    ANDROID_BUILD_SDK_VERSION = 35
    ANDROID_BUILD_TOOLS_VERSION = "35.0.0"

    ANDROID_BUILD_MIN_SDK_VERSION = 21
    ANDROID_BUILD_TARGET_SDK_VERSION = 35

    // Google Stuffs
    supportPackageVersion = "28.0.0"

    // APT plugin and Android Annotations
    daggerVersion = "1.2.1"
    androidAnnotationsVersion = "4.8.0"

    // EventBus
    eventBusVersion = "3.3.1"

    // Timber
    timberVersion = "5.0.1"

    androidUtilVersion = "0.1.1"

    // http://tools.android.com/tech-docs/new-build-system/tips
    preDexLibs = !project.hasProperty('disablePreDex')
}
